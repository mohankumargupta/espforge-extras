name: Release Wokwi Custom Chip

on:
  workflow_dispatch:
    inputs:
      example:
        description: 'Example name (e.g. i2c_example)'
        required: true
        type: string

permissions:
  contents: write

# Prevent concurrent releases from competing for the same next universal tag
concurrency:
  group: release-chip-universal
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate input and locate chip sources
        run: |
          EXAMPLE="${{ inputs.example }}"
          case "$EXAMPLE" in
            '' | *[!a-z0-9_]*) echo "❌ invalid example name: '$EXAMPLE'" >&2; exit 1 ;;
          esac

          DIR="espforge-examples-generated/$EXAMPLE"
          if [ ! -f "$DIR/chip.json" ] || [ ! -f "$DIR/chip.wasm" ]; then
            echo "❌ $DIR has no chip.json/chip.wasm — is '$EXAMPLE' a chip example?" >&2
            exit 1
          fi

          echo "EXAMPLE=$EXAMPLE" >> "$GITHUB_ENV"
          echo "CHIP_DIR=$DIR" >> "$GITHUB_ENV"
          echo "✓ chip sources: $DIR"

      - name: Compute next universal version
        run: |
          chmod +x scripts/chip-version.sh
          ./scripts/chip-version.sh fetch

          VERSION="$(./scripts/chip-version.sh next)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$VERSION" >> "$GITHUB_ENV"
          echo "→ next universal tag: $VERSION"

      - name: Create tag and release with chip.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ( cd "$CHIP_DIR" && zip -j "$GITHUB_WORKSPACE/chip.zip" chip.json chip.wasm )
          KEY="$(./scripts/chip-version.sh name "$EXAMPLE")"

          gh release create "$RELEASE_TAG" "$GITHUB_WORKSPACE/chip.zip" \
            --target "$GITHUB_SHA" \
            --title "$EXAMPLE chip $VERSION" \
            --notes "Wokwi custom chip for \`$EXAMPLE\` (universal version \`$VERSION\`).

          Pin in \`diagram.json\`:

          \`\`\`json
          \"dependencies\": { \"$KEY\": \"github:${{ github.repository }}@$RELEASE_TAG\" }
          \`\`\`"

      - name: Update version.txt
        run: |
          ./scripts/chip-version.sh set "$VERSION"
          echo "✓ Updated version.txt to $VERSION"

      - name: Pin the released tag in diagram.json
        run: |
          DIAGRAM="wokwi/$EXAMPLE/diagram.json"
          if [ ! -f "$DIAGRAM" ]; then
            echo "::warning::wokwi/$EXAMPLE/diagram.json not found; skipping diagram pin."
            exit 0
          fi

          KEY="$(./scripts/chip-version.sh name "$EXAMPLE")"
          python3 - "$DIAGRAM" "$KEY" "github:${{ github.repository }}@$RELEASE_TAG" <<'PY'
          import json, sys
          path, key, value = sys.argv[1:4]
          with open(path, encoding="utf-8") as f:
              diagram = json.load(f)
          deps = diagram.get("dependencies")
          if not isinstance(deps, dict):
              deps = {}
          deps[key] = value
          diagram["dependencies"] = deps
          with open(path, "w", encoding="utf-8") as f:
              json.dump(diagram, f, indent=2)
              f.write("\n")
          print(f"pinned {key} -> {value}")
          PY

      - name: Update root README.md and commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          chmod +x scripts/generate-readme.sh
          ./scripts/generate-readme.sh

          git add version.txt "wokwi/$EXAMPLE/diagram.json" README.md
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore($EXAMPLE): release chip $RELEASE_TAG and update README"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
